name: 工程与框架验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win32-x64, runner: windows-2025, arch: x64 }
          - { platform: win32-arm64, runner: windows-11-arm, arch: arm64 }
          - { platform: linux-x64, runner: ubuntu-24.04, arch: x64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64 }
          - { platform: darwin-x64, runner: macos-15-intel, arch: x64 }
          - { platform: darwin-arm64, runner: macos-15, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node -e "if(process.platform+'-'+process.arch !== process.env.EXPECTED_PLATFORM) throw Error('Runner architecture mismatch')"
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
      - name: 编译 core
        run: pnpm --dir packages/core build
      - name: 编译 CSS
        run: pnpm --dir packages/css build
      - name: 编译 compiler
        run: pnpm --dir packages/compiler build
      - run: pnpm --dir packages/compiler test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: 检查生成数据
        run: pnpm -r --filter "./packages/**" generate:check
      - run: pnpm lint
      - name: 编译 core
        run: pnpm --dir packages/core build
      - name: 编译 CSS
        run: pnpm --dir packages/css build
      - name: 编译 compiler
        run: pnpm --dir packages/compiler build
      - name: 编译 UI
        run: pnpm --dir packages/ui build
      - name: 生成 UI 类型声明
        run: pnpm --dir packages/ui build:types
      - name: 检查各项目类型与框架语义
        run: pnpm -r check
      - name: 检查仓库工具类型与框架语义
        run: pnpm check
      - name: 检查原始 TSX 的 IDE 兼容性
        run: pnpm --dir apps/example check:tsx
      - name: 各项目测试
        run: pnpm -r test
      - name: 仓库工具测试
        run: pnpm test
      - run: pnpm --dir packages/core test:stability
      - run: pnpm --dir packages/compiler lsp:setup
      - run: pnpm --dir packages/compiler lsp:verify
      - run: pnpm --dir packages/compiler lsp:completions
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stability-metrics
          path: reports/stability/stability-node.json
          if-no-files-found: ignore
          retention-days: 14

  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    # 镜像已包含浏览器和系统依赖，避免每轮向 Azure apt 镜像下载 WebKit 依赖。
    # 版本必须与 pnpm catalog 中的 @playwright/test 一致；由 tooling 用例校验。
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      # Actions 默认挂载的 /github/home 属于宿主用户，Firefox 拒绝 root 使用它。
      HOME: /root
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 编译 core
        run: pnpm --dir packages/core build
      - name: 编译 CSS
        run: pnpm --dir packages/css build
      - name: 编译 compiler
        run: pnpm --dir packages/compiler build
      - name: 编译 UI
        run: pnpm --dir packages/ui build
      - name: 生成 UI 类型声明
        run: pnpm --dir packages/ui build:types
      - name: 编译文档客户端
        run: pnpm --dir apps/docs build:client
      - name: 编译文档服务端
        run: pnpm --dir apps/docs build:server
      - name: 编译示例客户端
        run: pnpm --dir apps/example build:client
      - name: 编译示例服务端
        run: pnpm --dir apps/example build:server
      - run: pnpm test:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stability-${{ matrix.browser }}
          path: test-results/**/stability.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-${{ matrix.browser }}-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package-consumer-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 编译 core
        run: pnpm --dir packages/core build
      - name: 编译 CSS
        run: pnpm --dir packages/css build
      - name: 编译 compiler
        run: pnpm --dir packages/compiler build
      - run: pnpm test:packages
      - run: pnpm --dir apps/example test:dev
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: package-consumer-linux-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package-consumer-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: 编译 core
        run: pnpm --dir packages/core build
      - name: 编译 CSS
        run: pnpm --dir packages/css build
      - name: 编译 compiler
        run: pnpm --dir packages/compiler build
      - run: pnpm test:packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: package-consumer-windows-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  release-artifacts:
    needs: [verify, browser, package-consumer-linux, package-consumer-windows, toolchain-platforms]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 编译 core
        run: pnpm --dir packages/core build
      - name: 编译 CSS
        run: pnpm --dir packages/css build
      - name: 编译 compiler
        run: pnpm --dir packages/compiler build
      - run: pnpm release:pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
