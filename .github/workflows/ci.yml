name: 工程与框架验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:stability
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: 50d70a3f5f453a79a4323b263165da51f656a4e3
          path: .codex/typescript-source
          persist-credentials: false
          sparse-checkout: |
            tsc/cmd
            tsc/internal
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - run: pnpm compiler:native:build --source .codex/typescript-source --test
      - run: pnpm compiler:native:build --source .codex/typescript-source --platform win32-x64
      - run: pnpm test:native
      - run: pnpm lsp:setup
      - run: pnpm lsp:verify
      - run: pnpm lsp:completions
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:packages
      - run: pnpm test:native:packages
      - run: pnpm test:dev
      - run: pnpm test:hosts:dev
      - run: pnpm test:dev
        env:
          ZERODEP_COMPILER: native
      - run: pnpm test:hosts:dev
        env:
          ZERODEP_COMPILER: native
      - run: pnpm test:hosts:packages
      - run: pnpm test:e2e
      - run: pnpm test:e2e
        env:
          ZERODEP_COMPILER: native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stability-metrics
          path: |
            reports/stability/stability-node.json
            test-results/**/stability.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package-consumer-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 10.34.5
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/TypeScript
          ref: 50d70a3f5f453a79a4323b263165da51f656a4e3
          path: .codex/typescript-source
          persist-credentials: false
          sparse-checkout: |
            tsc/cmd
            tsc/internal
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - run: pnpm compiler:native:build --source .codex/typescript-source --test
      - run: pnpm compiler:native:build --source .codex/typescript-source --platform linux-x64
      - run: pnpm exec playwright install chromium
      - run: pnpm test:packages
      - run: pnpm test:hosts:packages
      - run: pnpm test:native:packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: package-consumer-windows-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
